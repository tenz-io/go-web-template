<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <title>管理后台 - {{.name}}</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<div class="header">
    <h1>🎛️ {{.name}} 管理后台</h1>
    <button class="logout-btn" onclick="logout()">退出登录</button>
</div>

<div class="container">
    <div class="stats">
        <div class="stat-card">
            <div class="stat-number">1</div>
            <div class="stat-label">在线用户</div>
        </div>
        <div class="stat-card">
            <div class="stat-number">5</div>
            <div class="stat-label">今日访问</div>
        </div>
        <div class="stat-card">
            <div class="stat-number">12</div>
            <div class="stat-label">总令牌数</div>
        </div>
        <div class="stat-card">
            <div class="stat-number">99.9%</div>
            <div class="stat-label">系统状态</div>
        </div>
    </div>

    <!-- 功能选项卡 -->
    <div class="admin-tabs">
        <button class="tab-btn active" data-tab="change-password">修改密码</button>
        <button class="tab-btn" data-tab="user-management">用户管理</button>
        <button class="tab-btn" data-tab="add-user">添加用户</button>
        <button class="tab-btn" data-tab="system-info">系统信息</button>
    </div>

    <!-- 修改密码选项卡 -->
    <div id="change-password" class="tab-content active">
        <div class="card">
            <h2>🔐 修改管理员密码</h2>
            <form id="changePasswordForm" class="admin-form">
                <div class="form-group">
                    <label for="oldPassword">当前密码</label>
                    <input type="password" id="oldPassword" name="oldPassword" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">新密码</label>
                    <input type="password" id="newPassword" name="newPassword" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认新密码</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
                </div>
                <button type="submit" class="btn">修改密码</button>
            </form>
            <div id="changePasswordMessage" class="message"></div>
        </div>
    </div>

    <!-- 用户管理选项卡 -->
    <div id="user-management" class="tab-content">
        <div class="card">
            <h2>👥 用户管理</h2>
            <div class="user-actions">
                <button id="refreshUsersBtn" class="btn">刷新用户列表</button>
            </div>
            <div class="user-table-container">
                <table id="userTable" class="user-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>用户名</th>
                        <th>角色</th>
                        <th>邮箱</th>
                        <th>创建时间</th>
                    </tr>
                    </thead>
                    <tbody id="userTableBody">
                    <!-- 用户数据将通过 JavaScript 动态加载 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 添加用户选项卡 -->
    <div id="add-user" class="tab-content">
        <div class="card">
            <h2>➕ 添加新用户</h2>
            <form id="addUserForm" class="admin-form">
                <div class="form-group">
                    <label for="addUsername">用户名</label>
                    <input type="text" id="addUsername" name="username" required>
                </div>
                <div class="form-group">
                    <label for="addPassword">密码</label>
                    <input type="password" id="addPassword" name="password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="addEmail">邮箱</label>
                    <input type="email" id="addEmail" name="email" required>
                </div>
                <div class="form-group">
                    <label for="addRole">角色</label>
                    <select id="addRole" name="role" required>
                        <option value="user">普通用户</option>
                        <option value="admin">管理员</option>
                    </select>
                </div>
                <button type="submit" class="btn">添加用户</button>
            </form>
            <div id="addUserMessage" class="message"></div>
        </div>
    </div>

    <!-- 系统信息选项卡 -->
    <div id="system-info" class="tab-content">
        <div class="card">
            <h2>📊 系统信息</h2>
            <p><strong>服务名称:</strong> {{.name}}</p>
            <p><strong>运行环境:</strong> 开发环境</p>
            <p><strong>版本:</strong> v1.0.0</p>
            <p><strong>启动时间:</strong> <span id="startTime"></span></p>
        </div>
    </div>
</div>

<script src="/static/js/common.js"></script>
<script src="/static/js/admin.js"></script>
</body>
</html>
