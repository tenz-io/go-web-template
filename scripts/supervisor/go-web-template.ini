[program:go-web-template]
command = {{ENV_APP_PATH}}/bin/vox -c {{ENV_APP_PATH}}/app.yaml -e {{ENV_APP_PATH}}/.env -p 8090 -l {{ENV_APP_PATH}}/log -s
process_name = %(program_name)s
directory = {{ENV_APP_PATH}}
autostart = false
autorestart = false
startsecs = 5
exitcodes = 0,2
user = {{USER}}
redirect_stderr = true
stdout_logfile = {{ENV_APP_PATH}}/log/%(program_name)s.log
stdout_logfile_maxbytes = 1MB
stdout_logfile_backups = 5
